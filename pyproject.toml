[project]
name = "open-slx"
version = "0.1.0"
description = "Convert SCiLS Lab .slx/.sbd projects to imzML without SCiLS Lab"
readme = "README.md"
license = "MIT"
authors = [{ name = "Parker Smith" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "aiohttp>=3.14.5",
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "numpy",
    "requests>=2.34.2",
    "zstandard>=0.25.0",
]

[project.urls]
Repository = "https://github.com/elparko/open-slx"

[project.scripts]
open-slx = "open_slx.cli:main"

[dependency-groups]
dev = [
    "pyimzml>=1.5.5",
    "pytest",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_slx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: reads the Zenodo .sbd over HTTP (needs SLX_NETWORK=1)"]
